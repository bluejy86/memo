<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메모 홈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-primary: #3182f6;
  --surface-page: #f2f4f6;
  --surface-card: #ffffff;
  --text-primary: #191f28;
  --text-secondary: #4e5968;
  --text-muted: #8b95a1;
  --text-on-primary: #ffffff;
  --label-blue-soft: #e8f3ff;
  --label-green-soft: #e3f8ec;
  --label-orange-soft: #fff1e5;
  --label-pink-soft: #ffeaf1;
  --space-4: 4px; --space-8: 8px; --space-12: 12px; --space-16: 16px;
  --space-20: 20px; --space-24: 24px; --space-34: 34px; --space-64: 64px;
  --radius-sm: 12px; --radius-md: 16px; --radius-xl: 24px; --radius-full: 999px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--surface-page); font-family: "Noto Sans KR", sans-serif; color: var(--text-primary); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
img { display: block; }

.screen {
  width: 100%; max-width: 390px; min-height: 100vh; min-height: 100dvh; margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--space-16);
  padding: var(--space-64) var(--space-16) var(--space-34);
  background: var(--surface-page);
}
.main { flex: 1; display: flex; flex-direction: column; gap: var(--space-16); }

.header { display: flex; flex-direction: column; gap: var(--space-8); padding: 0 var(--space-8); }
.header__date { font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); }
.header__title { font-size: 28px; line-height: 38px; font-weight: 700; letter-spacing: -0.8px; }
.header__title em { font-style: normal; color: var(--color-primary); }

.filter { display: flex; gap: var(--space-8); padding: 0 var(--space-4); overflow-x: auto; scrollbar-width: none; }
.filter::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 36px; padding: 0 var(--space-16); border-radius: var(--radius-full);
  background: var(--surface-card); color: var(--text-secondary);
  font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--color-primary); color: var(--text-on-primary); }

.card { background: var(--surface-card); border-radius: var(--radius-xl); padding: var(--space-8) 0; }
.card__header {
  display: flex; align-items: center; gap: var(--space-4); height: 40px;
  padding: var(--space-12) var(--space-16) var(--space-4) var(--space-20);
}
.card__title { flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 700; letter-spacing: -0.2px; }
.card__header img.pin { width: 16px; height: 16px; flex: none; }
.more { display: flex; align-items: center; gap: var(--space-4); font-size: 15px; line-height: 22px; font-weight: 500; letter-spacing: -0.2px; color: var(--text-muted); }
.more img { width: 16px; height: 16px; }

.memo {
  display: flex; align-items: center; gap: var(--space-16); width: 100%; height: 72px;
  padding: var(--space-12) var(--space-20); text-align: left;
}
.memo__tile { flex: none; width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
.memo__tile img { width: 22px; height: 22px; }
.memo__tile--blue { background: var(--label-blue-soft); }
.memo__tile--green { background: var(--label-green-soft); }
.memo__tile--orange { background: var(--label-orange-soft); }
.memo__tile--pink { background: var(--label-pink-soft); }
.memo__content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--space-4); }
.memo__title { font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.3px; color: var(--text-primary); }
.memo__preview { font-size: 14px; line-height: 20px; font-weight: 400; letter-spacing: -0.1px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.memo__date { flex: none; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }

.btn-primary {
  position: sticky; bottom: var(--space-34); flex: none; width: 100%; height: 56px;
  display: flex; align-items: center; justify-content: center; gap: var(--space-8);
  padding: 0 var(--space-24); border-radius: var(--radius-md);
  background: var(--color-primary); color: var(--text-on-primary);
  font-size: 17px; line-height: 24px; font-weight: 700; letter-spacing: -0.2px;
}
.btn-primary img { width: 20px; height: 20px; }
</style>
</head>
